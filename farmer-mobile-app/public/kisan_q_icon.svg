<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="kqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded square with border -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#kqGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Outer "Q" circle -->
  <circle cx="48" cy="46" r="28" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" />
  
  <!-- "Q" tail forming an upward growth sprout/tractor track -->
  <path d="M 64 62 L 80 82" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round" />
  <circle cx="80" cy="82" r="3" fill="#fbbf24" />

  <!-- Central Golden Wheat Sheaf / Crop Stalk -->
  <!-- Stem -->
  <path d="M 48 64 C 48 50 48 34 48 24" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Grain Seeds Left & Right -->
  <ellipse cx="43" cy="40" rx="4.5" ry="7" transform="rotate(-32 43 40)" fill="url(#goldGrad)" />
  <ellipse cx="53" cy="40" rx="4.5" ry="7" transform="rotate(32 53 40)" fill="url(#goldGrad)" />
  <ellipse cx="43" cy="30" rx="4" ry="6.5" transform="rotate(-30 43 30)" fill="url(#goldGrad)" />
  <ellipse cx="53" cy="30" rx="4" ry="6.5" transform="rotate(30 53 30)" fill="url(#goldGrad)" />
  <!-- Top Grain Tip -->
  <ellipse cx="48" cy="22" rx="3.5" ry="6" fill="url(#goldGrad)" />

  <!-- Small accent sparkles -->
  <circle cx="28" cy="28" r="1.5" fill="#fef08a" />
  <circle cx="68" cy="26" r="1.5" fill="#fef08a" />
</svg>
